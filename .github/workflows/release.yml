name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build app bundles
        run: |
          make bundle VERSION="${GITHUB_REF_NAME}" ARCH=arm64
          make bundle VERSION="${GITHUB_REF_NAME}" ARCH=x86_64

      - name: Zip app bundles
        run: |
          cd dist/arm64
          zip -ry ../Resticker-macos-arm64.zip Resticker.app
          cd ../x86_64
          zip -ry ../Resticker-macos-amd64.zip Resticker.app

      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)"
            else
              git log "${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)"
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Resticker-macos-arm64.zip \
            dist/Resticker-macos-amd64.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.notes.outputs.notes }}"

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA256=$(shasum -a 256 dist/Resticker-macos-arm64.zip | awk '{print $1}')
          AMD_SHA256=$(shasum -a 256 dist/Resticker-macos-amd64.zip | awk '{print $1}')

          git fetch origin main
          git checkout main

          sed -i '' "s/^  version \".*\"\$/  version \"${VERSION}\"/" Casks/resticker.rb
          perl -0777 -pi -e "s/(on_arm do\n\s*sha256 )\"[^\"]*\"/\${1}\"${ARM_SHA256}\"/" Casks/resticker.rb
          perl -0777 -pi -e "s/(on_intel do\n\s*sha256 )\"[^\"]*\"/\${1}\"${AMD_SHA256}\"/" Casks/resticker.rb

          if ! git diff --quiet -- Casks/resticker.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/resticker.rb
            git commit -m "chore: update cask to ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
