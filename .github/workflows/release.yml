name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make bundle

      - name: Zip app bundle
        run: |
          cd dist
          zip -ry Resticker-macos-arm64.zip Resticker.app

      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)"
            else
              git log "${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)"
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Resticker-macos-arm64.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.notes.outputs.notes }}"
